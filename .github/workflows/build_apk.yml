name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Install Components
        run: |
          SDK_MGR=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDK_MGR="sdkmanager"
          elif [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDK_MGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -n "$SDK_MGR" ]; then
            yes | $SDK_MGR --licenses || true
            $SDK_MGR "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" "platform-tools" || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Build Environment & Keys
        run: |
          touch .env
          touch .env.example
          if [ -f debug.keystore.base64 ] && [ -s debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          chmod +x gradlew || true

      - name: Build APK with Gradle
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jolly-Slushie-POS-APK
          path: app/build/outputs/apk/debug/*.apk
